<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Bingo UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #0f051d 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #24143a 0%, #120720 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
            color: #b8b8d0;
        }

        /* Game Info Bar */
        .info-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-box span {
            display: block;
            font-weight: bold;
            color: #ffaa00;
            margin-top: 2px;
        }

        /* Main Content Area */
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        /* Bingo Board */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            text-align: center;
        }

        .bingo-header-cell {
            background: #6226d9;
            color: white;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 14px;
        }

        .bingo-cell {
            background: #362259;
            color: #ddd;
            padding: 12px 0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .bingo-cell.marked {
            background: #ff5722;
            color: white;
            border-color: #ff784e;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #180a2b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #8b85a1;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: #a855f7;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-icons">
                <span>&#10005;</span>
            </div>
            <div class="header-title">
                <span>Beteseb Bingo</span>
            </div>
            <div class="header-icons">
                <span>&#8942;</span>
            </div>
        </div>

        <!-- Info Bar -->
        <div class="info-bar">
            <div class="info-box">GAME ID <span>#BB6GMV1P</span></div>
            <div class="info-box">PLAYERS <span>137</span></div>
            <div class="info-box">BET <span>10</span></div>
            <div class="info-box">DERASH <span>1096</span></div>
        </div>

        <!-- Content (Bingo Grid) -->
        <div class="content">
            <div class="bingo-grid">
                <!-- B I N G O Headers -->
                <div class="bingo-header-cell" style="background: #3b82f6;">B</div>
                <div class="bingo-header-cell" style="background: #ef4444;">I</div>
                <div class="bingo-header-cell" style="background: #10b981;">N</div>
                <div class="bingo-header-cell" style="background: #f59e0b;">G</div>
                <div class="bingo-header-cell" style="background: #8b5cf6;">O</div>

                <!-- Row 1 -->
                <div class="bingo-cell marked">1</div>
                <div class="bingo-cell">18</div>
                <div class="bingo-cell">31</div>
                <div class="bingo-cell">47</div>
                <div class="bingo-cell">62</div>
                <!-- Row 2 -->
                <div class="bingo-cell">3</div>
                <div class="bingo-cell marked">16</div>
                <div class="bingo-cell">37</div>
                <div class="bingo-cell">48</div>
                <div class="bingo-cell">67</div>
                <!-- Row 3 -->
                <div class="bingo-cell">8</div>
                <div class="bingo-cell">21</div>
                <div class="bingo-cell marked">FREE</div>
                <div class="bingo-cell">51</div>
                <div class="bingo-cell">69</div>
                <!-- Row 4 -->
                <div class="bingo-cell">10</div>
                <div class="bingo-cell">25</div>
                <div class="bingo-cell">39</div>
                <div class="bingo-cell marked">56</div>
                <div class="bingo-cell">72</div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S19.67 8 20.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                Game
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                History
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                Wallet
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </div>
        </div>
    </div>

</body>
</html>
