<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Bingo</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBg: '#0f051d',
                        panelBg: '#1a0b2e',
                        cardBg: '#24143a',
                        boardBg: '#1e1135',
                        activeCell: '#d97706',
                        calledBall: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #0b0317;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(245, 158, 11, 0.9); }
        }
        .pulse-ball {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-white flex justify-center items-center sm:p-2">

    <!-- Mobile Mini App Outer Frame -->
    <div class="w-full max-w-[430px] h-screen sm:h-[850px] bg-gradient-to-b from-[#1c0c33] via-[#120624] to-[#0a0216] flex flex-col justify-between shadow-2xl sm:rounded-2xl border border-white/10 overflow-hidden relative">

        <!-- Top Header Bar -->
        <header class="flex justify-between items-center px-4 py-2.5 bg-black/20 border-b border-white/10 backdrop-blur-md z-20">
            <button onclick="resetToCardSelection()" class="text-gray-300 hover:text-white p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="text-base font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-purple-300">
                AZ Bingo
            </div>
            <div class="flex items-center gap-2">
                <button id="sound-btn" onclick="toggleAudio()" class="text-amber-400 p-1" title="Sound">
                    <svg id="sound-icon-on" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <svg id="sound-icon-off" class="w-5 h-5 hidden text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
                <!-- Admin Button: Visible ONLY to ADMIN_ID (371093083) -->
                <button id="admin-secret-btn" onclick="toggleAdminPanel()" class="hidden text-xs bg-purple-900/60 hover:bg-purple-800 text-purple-200 px-2 py-0.5 rounded border border-purple-400/30">Admin</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="grid grid-cols-5 gap-1 px-2 py-1.5 bg-black/40 border-b border-white/5 text-center text-xs">
            <div class="bg-purple-950/60 rounded p-1 border border-purple-500/20">
                <div class="text-[9px] text-gray-400 uppercase">Game ID</div>
                <div id="stat-game-id" class="text-[10px] font-bold text-amber-400 truncate">#BBFEH21J</div>
            </div>
            <div class="bg-purple-950/60 rounded p-1 border border-purple-500/20">
                <div class="text-[10px] text-gray-300">ተጫዋች</div>
                <div id="stat-players" class="text-xs font-bold text-amber-400">57</div>
            </div>
            <div class="bg-purple-950/60 rounded p-1 border border-purple-500/20">
                <div class="text-[9px] text-gray-400 uppercase">Bet</div>
                <div id="stat-bet" class="text-xs font-bold text-amber-400">10</div>
            </div>
            <div class="bg-purple-950/60 rounded p-1 border border-purple-500/20">
                <div class="text-[10px] text-gray-300">ደረሽ</div>
                <div id="stat-derash" class="text-xs font-bold text-amber-400">399</div>
            </div>
            <div class="bg-purple-950/60 rounded p-1 border border-purple-500/20">
                <div class="text-[9px] text-gray-400 uppercase">Called</div>
                <div id="stat-called-count" class="text-xs font-bold text-amber-400">0</div>
            </div>
        </section>

        <!-- DYNAMIC TAB CONTENT AREA -->
        <div id="tab-container" class="flex-1 overflow-hidden relative flex flex-col">

            <!-- TAB 1: GAME INTERFACE -->
            <div id="tab-game" class="tab-content flex-1 flex flex-col p-2 space-y-2 overflow-y-auto custom-scroll">
                
                <div id="card-selection-section" class="flex-1 flex flex-col space-y-2">
                    <div class="flex justify-between items-center text-xs bg-purple-900/40 p-2 rounded-lg border border-purple-500/20">
                        <div>
                            <div class="text-gray-300 font-bold">የካርድ ምርጫ (1-300)</div>
                            <div class="text-[10px] text-gray-400">ከ1-300 ውስጥ 2 ካርድ ብቻ ይምረጡ</div>
                        </div>
                        <div class="text-right">
                            <div id="reg-countdown" class="text-base font-black text-amber-400 font-mono">00:45</div>
                            <div class="text-[9px] text-gray-400">ቀሪ ጊዜ</div>
                        </div>
                    </div>

                    <div class="h-56 overflow-y-auto custom-scroll bg-black/40 p-2 rounded-xl border border-white/5 grid grid-cols-6 gap-1.5" id="card-grid-300"></div>

                    <div class="bg-white/5 p-2.5 rounded-xl border border-white/10 flex justify-between items-center text-xs">
                        <div>
                            <div class="text-gray-400 text-[10px]">የመረጧቸው ካርዶች:</div>
                            <div id="selected-cards-badge" class="font-bold text-amber-300">ምንም አልተመረጠም</div>
                        </div>
                        <button id="btn-confirm-cards" onclick="confirmCardSelection()" class="bg-gradient-to-r from-amber-500 to-orange-600 text-white px-3 py-2 rounded-lg font-bold
